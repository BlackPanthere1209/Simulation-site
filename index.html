<style>

/* =========================================================
   FATIH BOUTIQUE — PREMIUM CANON BEACH
   FULL WEBSITE CSS
   ========================================================= */


/* =========================================================
   01. ROOT VARIABLES
   ========================================================= */

:root {
  --green-950: #03130c;
  --green-900: #061b12;
  --green-850: #082419;
  --green-800: #0b2d20;
  --green-700: #103c2a;

  --gold: #d8b653;
  --gold-light: #f4dc85;
  --gold-soft: #e7ca72;

  --white: #ffffff;
  --white-soft: rgba(255,255,255,.82);
  --white-muted: rgba(255,255,255,.62);

  --glass: rgba(255,255,255,.065);
  --glass-strong: rgba(255,255,255,.10);

  --border: rgba(255,255,255,.10);
  --gold-border: rgba(216,182,83,.28);

  --shadow:
    0 25px 70px rgba(0,0,0,.30);

  --shadow-soft:
    0 15px 40px rgba(0,0,0,.20);

  --radius-lg: 28px;
  --radius-md: 20px;
  --radius-sm: 14px;

  --transition: .35s cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   02. RESET
   ========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  background: var(--green-950);
}

body {
  min-height: 100vh;
  overflow-x: hidden;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  color: var(--white);

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(24,95,64,.20),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 40%,
      rgba(216,182,83,.07),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      var(--green-900),
      var(--green-950)
    );
}

img {
  max-width: 100%;
  display: block;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
}


/* =========================================================
   03. GLOBAL CONTAINER
   ========================================================= */

.container {
  width: min(1120px, calc(100% - 36px));
  margin-inline: auto;
}


/* =========================================================
   04. SECTIONS
   ========================================================= */

section {
  position: relative;
  padding: 110px 0;
}

section::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  width: min(850px, 90%);
  height: 1px;

  transform: translateX(-50%);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(216,182,83,.18),
      transparent
    );
}


/* =========================================================
   05. LANGUAGE SWITCH
   ========================================================= */

.language-switch {
  position: fixed;
  top: 18px;
  right: 20px;

  z-index: 9999;

  display: flex;
  gap: 4px;

  padding: 5px;

  border:
    1px solid rgba(255,255,255,.12);

  border-radius: 50px;

  background:
    rgba(3,19,12,.65);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  box-shadow:
    0 10px 35px rgba(0,0,0,.25);
}

.language-switch button {
  min-width: 38px;

  padding: 7px 10px;

  border: 0;
  border-radius: 30px;

  background: transparent;

  color: rgba(255,255,255,.65);

  font-size: 11px;
  font-weight: 800;
  letter-spacing: .5px;

  cursor: pointer;

  transition: var(--transition);
}

.language-switch button:hover {
  color: white;
}

.language-switch button.active {
  color: var(--green-950);

  background:
    linear-gradient(
      135deg,
      var(--gold-light),
      var(--gold)
    );

  box-shadow:
    0 5px 15px rgba(216,182,83,.22);
}


/* =========================================================
   06. HERO
   ========================================================= */

.hero {
  min-height: 100svh;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      rgba(2,15,9,.42),
      rgba(2,15,9,.70)
    ),
    url("images/excursion.jpg.jpeg")
    center center / cover no-repeat;
}


/* cinematic overlay */

.hero::before {
  content: "";

  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(216,182,83,.12),
      transparent 30%
    ),
    linear-gradient(
      90deg,
      rgba(3,19,12,.45),
      transparent 50%,
      rgba(3,19,12,.45)
    );

  pointer-events: none;
}


/* bottom fade */

.hero::after {
  content: "";

  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;

  height: 180px;

  background:
    linear-gradient(
      transparent,
      var(--green-900)
    );

  pointer-events: none;
}


.hero-content {
  position: relative;
  z-index: 3;

  width: min(900px, 92%);

  padding: 90px 20px 70px;

  animation:
    heroEntrance 1.2s
    cubic-bezier(.2,.8,.2,1)
    both;
}


@keyframes heroEntrance {

  from {
    opacity: 0;
    transform: translateY(30px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


/* =========================================================
   07. LOGO
   ========================================================= */

.logo {
  width: min(225px, 52vw);

  margin: 0 auto 25px;

  filter:
    drop-shadow(0 15px 30px rgba(0,0,0,.45));

  animation:
    logoFloat 5s ease-in-out infinite;
}


@keyframes logoFloat {

  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }

}


/* =========================================================
   08. HERO EDITION
   ========================================================= */

.edition {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  margin-bottom: 18px;

  padding: 8px 15px;

  border:
    1px solid rgba(216,182,83,.30);

  border-radius: 50px;

  background:
    rgba(216,182,83,.08);

  color: var(--gold-light);

  font-size: 11px;
  font-weight: 800;

  letter-spacing: 2.5px;
  text-transform: uppercase;

  backdrop-filter: blur(10px);
}


.edition::before {
  content: "✦";

  font-size: 12px;
}


/* =========================================================
   09. HERO TITLE
   ========================================================= */

.hero h1 {
  margin: 0;

  font-size:
    clamp(48px, 10vw, 100px);

  line-height: .9;

  letter-spacing:
    clamp(-5px, -.4vw, -2px);

  font-weight: 950;

  background:
    linear-gradient(
      120deg,
      #ffffff 10%,
      #f4dc85 48%,
      #ffffff 75%
    );

  -webkit-background-clip: text;
  background-clip: text;

  color: transparent;

  filter:
    drop-shadow(0 18px 35px rgba(0,0,0,.30));
}


.hero-subtitle {
  max-width: 680px;

  margin:
    28px auto 0;

  color:
    rgba(255,255,255,.82);

  font-size:
    clamp(15px, 2.3vw, 20px);

  line-height: 1.7;

  letter-spacing: .2px;
}


.hero-date {
  margin-top: 25px;

  color: var(--gold-light);

  font-size:
    clamp(18px, 3vw, 24px);

  font-weight: 900;

  letter-spacing: 2px;
}


.hero-date span {
  color: white;
}


.hero-date small {
  display: inline-block;

  margin-top: 8px;

  padding: 5px 12px;

  border-radius: 30px;

  background:
    rgba(255,255,255,.08);

  color: rgba(255,255,255,.75);

  font-size: 11px;

  letter-spacing: 2px;
}


/* =========================================================
   10. COUNTDOWN
   ========================================================= */

.countdown {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 12px;

  width: min(650px, 100%);

  margin:
    38px auto 0;
}


.time-box {
  position: relative;

  padding: 20px 10px;

  overflow: hidden;

  border:
    1px solid rgba(255,255,255,.11);

  border-radius: 18px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.035)
    );

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  box-shadow:
    0 15px 35px rgba(0,0,0,.18);

  transition: var(--transition);
}


.time-box::before {
  content: "";

  position: absolute;

  top: 0;
  left: 20%;

  width: 60%;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(244,220,133,.55),
      transparent
    );
}


.time-box:hover {
  transform: translateY(-5px);

  border-color:
    rgba(216,182,83,.30);
}


.time-box strong {
  display: block;

  color: var(--gold-light);

  font-size:
    clamp(28px, 5vw, 44px);

  font-weight: 900;

  line-height: 1;
}


.time-box span {
  display: block;

  margin-top: 9px;

  color:
    rgba(255,255,255,.55);

  font-size: 9px;

  letter-spacing: 1.5px;

  text-transform: uppercase;
}


/* =========================================================
   11. PROGRESS BAR
   ========================================================= */

.progress-container {
  width: min(650px, 100%);

  margin: 20px auto 0;
}


.progress-bar {
  position: relative;

  height: 4px;

  overflow: hidden;

  border-radius: 20px;

  background:
    rgba(255,255,255,.10);
}


#progress {
  position: relative;

  width: 0;
  height: 100%;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      #b89434,
      #f5df88,
      #b89434
    );

  box-shadow:
    0 0 14px rgba(216,182,83,.35);

  transition: width 1s linear;
}


/* =========================================================
   12. BUTTONS
   ========================================================= */

.buttons {
  display: flex;

  justify-content: center;
  align-items: center;

  flex-wrap: wrap;

  gap: 12px;

  margin-top: 32px;
}


.btn {
  position: relative;

  display: inline-flex;

  align-items: center;
  justify-content: center;

  min-height: 50px;

  padding:
    13px 24px;

  overflow: hidden;

  border:
    1px solid rgba(255,255,255,.14);

  border-radius: 50px;

  text-decoration: none;

  font-size: 13px;
  font-weight: 850;

  letter-spacing: .2px;

  transition: var(--transition);
}


.btn::before {
  content: "";

  position: absolute;

  top: 0;
  left: -120%;

  width: 70%;
  height: 100%;

  transform: skewX(-20deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.25),
      transparent
    );

  transition: .7s ease;
}


.btn:hover::before {
  left: 140%;
}


.btn:hover {
  transform: translateY(-4px);

  box-shadow:
    0 15px 30px rgba(0,0,0,.22);
}


.btn-primary {
  color: #07160e !important;

  border-color:
    rgba(255,220,120,.55);

  background:
    linear-gradient(
      135deg,
      #f2d878,
      #cba844
    );

  box-shadow:
    0 10px 25px rgba(216,182,83,.18);
}


.btn-primary:hover {
  box-shadow:
    0 18px 35px rgba(216,182,83,.27);
}


.btn-secondary {
  color: white !important;

  background:
    rgba(255,255,255,.065);

  backdrop-filter: blur(12px);
}


/* =========================================================
   13. SECTION TITLES
   ========================================================= */

.section-title {
  position: relative;

  text-align: center;

  margin-bottom: 55px;
}


.section-title small {
  display: inline-block;

  color: var(--gold-light);

  font-size: 10px;
  font-weight: 900;

  letter-spacing: 3px;

  text-transform: uppercase;
}


.section-title h2 {
  margin:
    12px 0 15px;

  color: white;

  font-size:
    clamp(30px, 5vw, 52px);

  line-height: 1.05;

  letter-spacing: -1.5px;
}


.section-title p {
  width: min(680px, 100%);

  margin-inline: auto;

  color:
    var(--white-muted);

  line-height: 1.8;

  font-size: 15px;
}


/* =========================================================
   14. EXPERIENCE
   ========================================================= */

.experience-grid {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 18px;
}


.glass-card {
  position: relative;

  min-height: 245px;

  padding: 30px 24px;

  overflow: hidden;

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:
    var(--radius-md);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  box-shadow:
    0 20px 45px rgba(0,0,0,.14);

  transition: var(--transition);
}


.glass-card::before {
  content: "";

  position: absolute;

  width: 130px;
  height: 130px;

  top: -65px;
  right: -65px;

  border-radius: 50%;

  background:
    rgba(216,182,83,.07);

  transition: var(--transition);
}


.glass-card:hover {
  transform:
    translateY(-8px);

  border-color:
    rgba(216,182,83,.28);

  box-shadow:
    0 25px 55px rgba(0,0,0,.24);
}


.glass-card:hover::before {
  transform: scale(1.4);
}


.card-icon {
  width: 58px;
  height: 58px;

  display: flex;

  align-items: center;
  justify-content: center;

  margin-bottom: 22px;

  border:
    1px solid rgba(216,182,83,.18);

  border-radius: 17px;

  background:
    rgba(216,182,83,.08);

  font-size: 26px;

  transition: var(--transition);
}


.glass-card:hover .card-icon {
  transform:
    rotate(-4deg)
    scale(1.06);

  background:
    rgba(216,182,83,.13);
}


.glass-card h3 {
  margin-bottom: 11px;

  font-size: 20px;

  letter-spacing: -.3px;
}


.glass-card p {
  color:
    var(--white-muted);

  font-size: 13px;

  line-height: 1.75;
}


/* =========================================================
   15. TICKETS
   ========================================================= */

.ticket-grid {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 22px;
}


.ticket-card {
  position: relative;

  padding: 38px;

  overflow: hidden;

  border:
    1px solid rgba(255,255,255,.10);

  border-radius:
    var(--radius-lg);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.085),
      rgba(255,255,255,.025)
    );

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  box-shadow:
    var(--shadow-soft);

  transition: var(--transition);
}


.ticket-card::before {
  content: "";

  position: absolute;

  top: -120px;
  right: -100px;

  width: 280px;
  height: 280px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(216,182,83,.13),
      transparent 65%
    );

  pointer-events: none;
}


.ticket-card:hover {
  transform:
    translateY(-8px);

  border-color:
    rgba(216,182,83,.32);

  box-shadow:
    0 30px 70px rgba(0,0,0,.28);
}


.ticket-card.vip {
  border-color:
    rgba(216,182,83,.35);

  background:
    linear-gradient(
      145deg,
      rgba(216,182,83,.105),
      rgba(255,255,255,.035)
    );
}


.ticket-card h3 {
  position: relative;

  font-size: 27px;

  letter-spacing: -.6px;
}


.price {
  position: relative;

  margin:
    15px 0 20px;

  color: var(--gold-light);

  font-size: 50px;

  font-weight: 950;

  letter-spacing: -2px;
}


.ticket-description {
  position: relative;

  margin-bottom: 25px;

  color:
    var(--white-muted);

  font-size: 14px;

  line-height: 1.6;
}


.ticket-list {
  position: relative;

  list-style: none;

  margin-bottom: 28px;
}


.ticket-list li {
  position: relative;

  margin:
    13px 0;

  padding-left: 26px;

  color:
    rgba(255,255,255,.80);

  font-size: 13px;

  line-height: 1.55;
}


.ticket-list li::before {
  content: "✓";

  position: absolute;

  left: 0;

  color:
    var(--gold-light);

  font-weight: 900;
}


/* =========================================================
   16. PAYMENT
   ========================================================= */

.payment-grid {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 16px;
}


.payment-card {
  position: relative;

  padding: 28px 16px;

  text-align: center;

  overflow: hidden;

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:
    var(--radius-md);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );

  backdrop-filter: blur(15px);

  box-shadow:
    0 15px 35px rgba(0,0,0,.13);

  transition: var(--transition);
}


.payment-card::after {
  content: "";

  position: absolute;

  left: 15%;
  right: 15%;
  bottom: 0;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(216,182,83,.45),
      transparent
    );

  opacity: 0;

  transition: var(--transition);
}


.payment-card:hover {
  transform:
    translateY(-7px);

  border-color:
    rgba(216,182,83,.28);
}


.payment-card:hover::after {
  opacity: 1;
}


.payment-icon {
  width: 66px;
  height: 66px;

  object-fit: contain;

  margin:
    0 auto 17px;

  border-radius: 16px;

  filter:
    drop-shadow(
      0 8px 16px rgba(0,0,0,.20)
    );

  transition: var(--transition);
}


.payment-card:hover .payment-icon {
  transform:
    translateY(-5px)
    scale(1.06);
}


.payment-card h3 {
  margin:
    5px 0 10px;

  color:
    var(--gold-light);

  font-size: 17px;
}


.payment-card p {
  margin: 5px 0;

  color:
    var(--white-muted);

  font-size: 12px;
  line-height: 1.6;
}


/* =========================================================
   17. PHONE NUMBERS
   ========================================================= */

.phone-number,
.phone-number:visited,
.phone-number:hover,
.phone-number:active {
  color: inherit !important;

  text-decoration: none !important;

  -webkit-text-decoration: none !important;
}


.phone-number {
  cursor: pointer;

  transition: var(--transition);
}


.phone-number:hover {
  color:
    var(--gold-light) !important;
}


/* =========================================================
   18. RESERVATION STEPS
   ========================================================= */

.steps {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 20px;

  width: min(900px, 100%);

  margin-inline: auto;
}


.step {
  position: relative;

  padding: 32px 22px;

  text-align: center;

  border:
    1px solid rgba(255,255,255,.08);

  border-radius:
    var(--radius-md);

  background:
    rgba(255,255,255,.035);

  transition: var(--transition);
}


.step:hover {
  transform:
    translateY(-6px);

  border-color:
    rgba(216,182,83,.23);
}


.step-number {
  width: 54px;
  height: 54px;

  display: flex;

  align-items: center;
  justify-content: center;

  margin:
    0 auto 18px;

  border:
    1px solid rgba(255,255,255,.35);

  border-radius: 50%;

  color:
    var(--green-950);

  background:
    linear-gradient(
      135deg,
      var(--gold-light),
      var(--gold)
    );

  font-size: 19px;
  font-weight: 900;

  box-shadow:
    0 10px 25px rgba(216,182,83,.15);
}


.step h3 {
  margin-bottom: 10px;

  font-size: 18px;
}


.step p {
  color:
    var(--white-muted);

  font-size: 13px;

  line-height: 1.7;
}


/* =========================================================
   19. FAQ
   ========================================================= */

.faq {
  width: min(850px, 100%);

  margin-inline: auto;
}


.faq-item {
  margin-bottom: 10px;

  overflow: hidden;

  border:
    1px solid rgba(255,255,255,.09);

  border-radius: 16px;

  background:
    rgba(255,255,255,.035);

  transition: var(--transition);
}


.faq-item:hover {
  border-color:
    rgba(216,182,83,.20);
}


.faq-question {
  width: 100%;

  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 20px;

  padding: 20px;

  border: 0;

  color: white;

  background: transparent;

  text-align: left;

  font-size: 14px;
  font-weight: 750;

  cursor: pointer;
}


.faq-arrow {
  flex-shrink: 0;

  color:
    var(--gold-light);

  font-size: 20px;

  transition:
    transform .3s ease;
}


.faq-answer {
  max-height: 0;

  overflow: hidden;

  transition:
    max-height .4s
    cubic-bezier(.2,.8,.2,1);
}


.faq-answer p {
  padding:
    0 20px 20px;

  color:
    var(--white-muted);

  font-size: 13px;

  line-height: 1.8;
}


.faq-item.open {
  border-color:
    rgba(216,182,83,.24);

  background:
    rgba(255,255,255,.055);
}


.faq-item.open .faq-answer {
  max-height: 350px;
}


.faq-item.open .faq-arrow {
  transform:
    rotate(180deg);
}


/* =========================================================
   20. FINAL CTA
   ========================================================= */

.final-section {
  position: relative;

  text-align: center;

  padding:
    125px 20px;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(216,182,83,.10),
      transparent 45%
    );
}


.final-section::before {
  display: none;
}


.final-section h2 {
